[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "three-rpr-sympy-jax"
version = "0.1.0"
description = "SymPy and JAX reduced-coordinate forward dynamics of a planar 3-RPR manipulator"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Akkarapakam Suneesh Jacob"},
  {name = "Sivasundar Manisankar"},
]
keywords = ["3-RPR", "parallel robot", "SymPy", "JAX", "Lagrangian dynamics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.26,<3",
  "sympy>=1.12,<2",
  "jax>=0.4.30,<1",
  "scipy>=1.12,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
three-rpr-experiments = "three_rpr_sympy_jax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
